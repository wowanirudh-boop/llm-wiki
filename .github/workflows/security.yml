name: Security

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  schedule:
    # Weekly on Monday at 06:00 UTC — catches advisories without repeating daily failures.
    - cron: "0 6 * * 1"

permissions:
  actions: read        # required by upload-sarif to read workflow run metadata
  contents: read
  security-events: write   # required for uploading SARIF to GitHub Security tab
  pull-requests: write     # required for dependency-review-action PR comments

jobs:
  osv-scan:
    name: OSV Scanner (manifests + npm lockfiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Avoid OSV's transitive manifest resolver here; it can exhaust its
      # iteration limit on Python requirements. The pip-audit job below scans
      # the complete hash-locked Python environments.
      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.6.0
        with:
          scan-args: |-
            --output-file=results.sarif
            --format=sarif
            --no-resolve
            --recursive
            ./

      # Upload results to GitHub's Security tab so they show up alongside
      # Dependabot alerts and can be triaged in one place.
      - name: Upload SARIF
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

  dependency-review:
    name: Dependency Review (PR diff)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      # Fails the PR if it introduces a new dependency with a known
      # vulnerability. Complements osv-scan (which scans the whole repo)
      # by giving fast, diff-based feedback on PRs specifically.
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always

  npm-audit:
    name: npm audit (web + extension)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_dir: [web, extension]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # `npm ci` enforces the committed lockfile's SHA-512 integrity hashes;
      # it refuses to install if package.json drifted from package-lock.json.
      # This is the supply-chain hardening boundary we want in CI.
      - name: Install (strict, hash-verified)
        working-directory: ${{ matrix.package_dir }}
        run: npm ci --ignore-scripts

      - name: Audit (fail on moderate+)
        working-directory: ${{ matrix.package_dir }}
        run: npm audit --audit-level=moderate

  deno-audit:
    name: Deno audit (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2

      - name: Audit Deno lockfile
        working-directory: web
        run: deno audit

  pip-audit:
    name: pip-audit (api + mcp + converter + tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path: [api, mcp, converter, tests]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      # Audit each component's hash-locked file when present.
      - name: Audit
        run: |
          if [ -f "${{ matrix.path }}/requirements.lock" ]; then
            pip-audit -r "${{ matrix.path }}/requirements.lock" --strict --desc
          else
            pip-audit -r "${{ matrix.path }}/requirements.txt" --strict --desc
          fi
