name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  frontend:
    name: Frontend (${{ matrix.package_dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_dir: [web, extension]
    defaults:
      run:
        working-directory: ${{ matrix.package_dir }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check extension types and tests
        if: matrix.package_dir == 'extension'
        run: |
          npm run check
          npm test

  unit:
    name: Unit tests (no DB)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install all dependencies
        run: pip install --require-hashes -r api/requirements.lock -r mcp/requirements.lock -r tests/requirements.lock

      - name: Run API unit tests
        run: PYTHONPATH=api pytest tests/unit/test_chunker.py tests/unit/test_helpers.py tests/unit/test_pdf_extract.py tests/unit/test_highlight_granular.py tests/unit/test_html_parser_highlights.py -v

      - name: Run MCP unit tests
        working-directory: mcp
        run: pytest ../tests/unit/mcp/ -v

  mcp-integration:
    name: MCP integration tests (SQLite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: pip install --require-hashes -r mcp/requirements.lock -r tests/requirements.lock

      - name: Run MCP VaultFS + tool handler tests
        working-directory: mcp
        run: pytest ../tests/integration/mcp/test_vaultfs_contract.py ../tests/integration/mcp/test_tool_handlers.py -v

  postgres-integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: supavault_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: pip install --require-hashes -r api/requirements.lock -r mcp/requirements.lock -r tests/requirements.lock

      - name: Run API isolation + lifecycle tests
        run: PYTHONPATH=api MODE=hosted pytest tests/integration/isolation/ tests/integration/test_kb_lifecycle.py tests/integration/test_note_lifecycle.py -v

      - name: Run MCP Postgres isolation tests
        working-directory: mcp
        run: pytest ../tests/integration/mcp/test_mcp_isolation.py -v
